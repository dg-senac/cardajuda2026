name: Gerar APK Android
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      supabase_url:
        description: "URL pública do projeto Supabase (https://<ref>.supabase.co). Vazio = usa a Variable MOBILE_SUPABASE_URL."
        required: false
        default: ""
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: cardajuda_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-local-only@127.0.0.1:5432/cardajuda_test
      - run: npm run typecheck
      - run: npm run lint
      - name: Bundle local interface (public configuration only)
        run: npm run mobile:build
        env:
          MOBILE_SUPABASE_URL: ${{ inputs.supabase_url || vars.MOBILE_SUPABASE_URL }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Assemble APK
        run: node scripts/android-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Carda-Ajuda-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Resumo
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo '### APK de teste gerado' >> "$GITHUB_STEP_SUMMARY"
          echo 'Baixe Carda-Ajuda-Android-debug, extraia app-debug.apk e instale. Exige internet. Não é release de produção.' >> "$GITHUB_STEP_SUMMARY"
