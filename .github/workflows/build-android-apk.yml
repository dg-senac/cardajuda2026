name: Build Android APK

# Gera o APK do Carda Ajuda.
#
# O APK é um "casco" (WebView) que abre o sistema publicado: o servidor Next.js
# com o banco. Ele NÃO carrega o app sozinho -- quem guarda os dados é o Postgres
# do Supabase, do outro lado do servidor.
#
# Por isso o endereço do servidor entra por FORA do código:
#   * Settings -> Secrets and variables -> Actions -> Variables ->
#     New repository variable -> APP_SERVER_URL = https://seu-app.vercel.app
#   * Sem essa variável o APK abre a tela "Endereço do servidor" e a pessoa
#     digita (ou cola) o endereço uma vez; fica guardado no aparelho.
#   * Com a variável definida, o build CONFERE se o endereço responde. Se não
#     responder, o build para com uma mensagem -- é isso que evita o APK que
#     abre com "Página da web não disponível / ERR_NAME_NOT_RESOLVED".
#
# Para gerar o APK apontando para um endereço diferente sem mexer nas variáveis:
# Actions -> Build Android APK -> Run workflow -> preencha "server_url".

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Endereço do servidor (ex.: https://cardiajuda.vercel.app). Vazio = o app pergunta no primeiro uso."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Definir endereço do servidor (www/config.js)
        run: node scripts/android-config.mjs
        env:
          APP_SERVER_URL: ${{ inputs.server_url || vars.APP_SERVER_URL }}
          APP_SERVER_URL_CHECK: ${{ vars.APP_SERVER_URL_CHECK || '1' }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Capacitor add android
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Ajustes do projeto Android
        run: node scripts/android-patch.mjs

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
